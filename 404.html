<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Halaman tidak ditemukan | Viscode Creative</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<meta name="theme-color" content="#0a1a3c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.nf{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:120px 24px 160px;
}
.nf-brand{
  position:absolute;
  top:28px;
  left:50%;
  transform:translateX(-50%);
  z-index:7;
}
.nf-brand img{height:44px;width:auto;object-fit:contain}
.nf-inner{position:relative;z-index:6;max-width:640px}
.nf-code{
  font-size:clamp(96px,22vw,220px);
  font-weight:500;
  line-height:.9;
  letter-spacing:-.07em;
  background:linear-gradient(180deg,#1f3478 0%,#3b6fe0 55%,#8cb8ff 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
}
.nf-title{
  margin-top:18px;
  font-size:clamp(24px,4vw,38px);
  font-weight:500;
  letter-spacing:-.04em;
  color:var(--navy);
}
.nf-text{
  margin:14px auto 0;
  max-width:460px;
  font-size:16px;
  line-height:1.6;
  color:var(--muted);
}
.nf-path{
  display:inline-block;
  max-width:100%;
  margin-top:18px;
  padding:6px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:500;
  color:var(--navy-2);
  background:rgba(255,255,255,.7);
  border:1px solid rgba(15,29,69,.08);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nf-path:empty{display:none}
.nf-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:32px;
}
.nf-actions .btn-dark{padding:0 26px}
@media (max-width:520px){
  .nf{padding:110px 20px 140px}
  .nf-actions .btn{width:100%;justify-content:center}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="arrow" viewBox="0 0 24 24">
      <path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 24 24">
      <path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<main class="hero nf">
  <div class="sky"></div>
  <div class="glow"></div>
  <div class="cloud cloud-back"></div>
  <div class="cloud cloud-mid"></div>

  <a href="/" class="nf-brand" aria-label="Viscode Creative">
    <img class="brand-mark" src="/assets/logo.png" alt="Viscode Creative">
  </a>

  <div class="nf-inner">
    <div class="nf-code" aria-hidden="true">404</div>
    <h1 class="nf-title" data-t="title">Halaman ini nyasar entah ke mana</h1>
    <p class="nf-text" data-t="text">Link yang kamu buka tidak ada atau sudah dipindahkan. Tenang, semua layanan kami masih ada di beranda.</p>
    <span class="nf-path" id="nfPath"></span>
    <div class="nf-actions">
      <a href="/" class="btn btn-dark">
        <span class="btn-ico"><svg width="16" height="16"><use href="#spark"/></svg></span>
        <span data-t="home">Kembali ke beranda</span>
      </a>
      <a href="/pricing" class="btn btn-ghost" data-t="price">Lihat harga</a>
    </div>
  </div>

  <div class="cloud cloud-front"></div>
  <div class="hero-fade"></div>
</main>

<script>
(function () {
  var EN = {
    title: 'This page got lost somewhere',
    text: 'The link you opened does not exist or has been moved. Do not worry, all our services are still on the homepage.',
    home: 'Back to homepage',
    price: 'See pricing'
  };
  var lang = 'id';
  try { lang = localStorage.getItem('viscode-lang') || 'id'; } catch (e) {}
  if (lang === 'en') {
    document.documentElement.setAttribute('lang', 'en');
    document.title = '404 — Page not found | Viscode Creative';
    [].slice.call(document.querySelectorAll('[data-t]')).forEach(function (el) {
      var v = EN[el.getAttribute('data-t')];
      if (v) el.textContent = v;
    });
  }
  var p = location.pathname;
  var el = document.getElementById('nfPath');
  if (el && p && p !== '/') el.textContent = p;
})();
</script>
</body>
</html>
